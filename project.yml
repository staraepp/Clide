name: Clide
options:
  bundleIdPrefix: com.staraepp
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: 1.0.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.15.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: 1.0.0

targets:
  Clide:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Clide
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio
      - package: KeyboardShortcuts
    info:
      path: Generated/Info.plist
      properties:
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSMicrophoneUsageDescription: "Clide needs microphone access to turn your speech into text right where you're typing."
        NSHumanReadableCopyright: "Copyright © 2026 Clide contributors. MIT Licensed."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.staraepp.Clide
        PRODUCT_NAME: Clide
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ENABLE_APP_SANDBOX: NO
